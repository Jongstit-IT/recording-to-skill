name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebview==6.2.1 pyinstaller==6.22.3
      - name: Build and test
        shell: pwsh
        run: |
          ./build.ps1
          $env:PATH = "$PWD\build\ffmpeg;$env:PATH"
          python tests/test_extract_frames.py; if ($LASTEXITCODE) { exit 1 }
          python tests/test_app.py; if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: RecordingToSkill
          path: dist/RecordingToSkill.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/RecordingToSkill.exe --title "Recording to Skill ${{ github.ref_name }}" --notes-file docs/release-notes.md
